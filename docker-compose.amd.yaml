# ===========================================
# GpuViewR — local AMD/ROCm install (no agent needed)
# ===========================================
#
# Single-host AMD setup since v0.4.0: the hub itself talks to rocm-smi
# on the host, so you don't need to install an extra agent container
# alongside it. Drop this file on your AMD box, set .env, `docker
# compose -f docker-compose.amd.yaml up -d`, done.
#
# Differences from docker-compose.yaml (the NVIDIA-flavoured default):
#   - GPU_VENDOR=amd forces the rocm collector (skip the auto probe
#     and the "nvidia-smi not available" log line on AMD-only hosts).
#   - /dev/kfd + /dev/dri device-mapped so the container can speak to
#     amdgpu through libdrm.
#   - group_add: ["video", "render"] gives the container user access
#     to the DRI devices without privileged mode. Numeric GIDs are
#     forwarded from .env because /etc/group inside the container
#     doesn't define those groups by name. Override VIDEO_GID /
#     RENDER_GID in .env when getent shows different values on your
#     box (ROCm-installed Debian often shifts render to 992).
#   - /opt/rocm bind-mounted read-only — rocm-smi is a Python script
#     symlinked to /opt/rocm/libexec/rocm_smi/rocm_smi.py, so we need
#     both the entry point AND its libraries.
#   - LD_LIBRARY_PATH set so the script finds librocm_smi64.so.1 (the
#     container has no /etc/ld.so.conf.d/rocm.conf the host install
#     drops). Without this the script exits 0 with empty stdout — see
#     server/services/rocmGpuCollector.ts "empty-output trap".
#
# Prerequisites on the remote host:
#   1. AMD GPU + amdgpu kernel driver.
#   2. ROCm installed at /opt/rocm (the standard location for AMD's
#      .deb packages on Debian/Ubuntu).
#   3. `rocm-smi --version` works as the user running docker.
#   4. Group IDs for `video` and `render` checked with
#      `getent group video render` (Debian defaults: 44 and 109,
#      override below).
#   5. (Optional) `apt install libdrm-amdgpu1` on the host silences
#      the libdrm startup warning — purely cosmetic.
# ===========================================

services:
  gpuviewr:
    image: ghcr.io/erreur32/gpuviewr:latest
    container_name: gpuviewr
    restart: unless-stopped

    ports:
      - "${DASHBOARD_PORT:-7510}:3015"

    devices:
      - /dev/kfd
      - /dev/dri

    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"

    environment:
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3015
      DASHBOARD_PORT: ${DASHBOARD_PORT:-7510}
      CONTAINER_NAME: gpuviewr
      HOST_IP: ${HOST_IP:-}
      TZ: ${TZ:-UTC}
      GPU_TICK_MS: ${GPU_TICK_MS:-1000}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}

      # Pin to the rocm collector — skips the auto probe path.
      GPU_VENDOR: amd
      ROCM_SMI_PATH: /opt/rocm/bin/rocm-smi

      # See the comment block at the top of this file: ROCm packages
      # drop /etc/ld.so.conf.d/rocm.conf on the host but not in the
      # container, so we have to point the loader at /opt/rocm/lib
      # ourselves. Required for rocm-smi to find librocm_smi64.so.1.
      LD_LIBRARY_PATH: /opt/rocm/lib:/opt/rocm/lib64

      # Resolve PID → process name without sharing the host PID namespace.
      HOST_PROC: /host/proc
      # Real host hostname (the container's UTS namespace hides it).
      # The hub reads /host/etc/hostname when this points at it.
      HOST_ETC: /host/etc
      # Optional explicit override — wins over both bind-mounts:
      # HUB_HOSTNAME: jarvis

    volumes:
      - ./data:/app/data
      - /opt/rocm:/opt/rocm:ro
      - /proc:/host/proc:ro
      # Static file from the host — kernel-independent way to recover
      # the real hostname from inside the container.
      - /etc/hostname:/host/etc/hostname:ro

    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3015/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
