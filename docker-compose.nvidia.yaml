# ===========================================
# GpuViewR — local NVIDIA install (no agent needed)
# ===========================================
#
# Single-host NVIDIA setup: the hub itself talks to nvidia-smi on the
# host via the NVIDIA Container Toolkit. Symmetric to
# docker-compose.amd.yaml — use this one when you have one NVIDIA box
# and want the simplest possible setup.
#
# The vendor-neutral docker-compose.yaml leaves the GPU passthrough
# commented out so users running the hub purely as a remote-agent
# aggregator (no local GPU) don't get the "runtime nvidia not
# installed" error on hosts without the toolkit. This file has it
# enabled out of the box.
#
# Prerequisites on the remote host:
#   1. NVIDIA Container Toolkit installed
#      https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#   2. `nvidia-smi` works in a container:
#      docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi
# ===========================================

services:
  gpuviewr:
    image: ghcr.io/erreur32/gpuviewr:latest
    container_name: gpuviewr
    restart: unless-stopped

    ports:
      - "${DASHBOARD_PORT:-7510}:3015"

    environment:
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3015
      DASHBOARD_PORT: ${DASHBOARD_PORT:-7510}
      CONTAINER_NAME: gpuviewr
      HOST_IP: ${HOST_IP:-}
      TZ: ${TZ:-Europe/Paris}
      GPU_TICK_MS: ${GPU_TICK_MS:-1000}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}

      # Pin to nvidia — skips the auto probe path.
      GPU_VENDOR: nvidia

      # Resolve PID → process name without sharing the host PID namespace.
      HOST_PROC: /host/proc
      # Real host hostname (the container's UTS namespace hides it).
      HOST_ETC: /host/etc
      # Optional explicit override — wins over the bind-mounts above:
      # HUB_HOSTNAME: my-server

    volumes:
      - ./data:/app/data
      - /proc:/host/proc:ro
      - /etc/hostname:/host/etc/hostname:ro

    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true

    # NVIDIA Container Toolkit passthrough — enabled by default in
    # this compose file (the vendor-neutral docker-compose.yaml leaves
    # it commented out).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    runtime: nvidia

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3015/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
