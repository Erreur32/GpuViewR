# ===========================================
# GpuViewR: Docker Compose
# ===========================================
#
# Quickstart:
#   1. Create .env:  echo "JWT_SECRET=$(openssl rand -base64 32)" > .env
#   2. Start:        docker compose up -d
#   3. Open:         http://localhost:7510   (first user becomes admin)
#
# Local GPU passthrough is OPT-IN — out of the box this compose runs in
# "control plane" mode: the hub starts on any host (AMD, no-GPU, dev
# laptop) and your GPUs are reported by remote agents enrolled from
# Settings → Hosts. To monitor the local NVIDIA GPU, uncomment the
# `deploy.resources` + `runtime: nvidia` block at the bottom of this
# service (requires the NVIDIA Container Toolkit:
# https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html ).
# For AMD/ROCm local monitoring, run the agent compose instead — see
# docker-compose.agent.amd.yml.
#
# Update:
#   docker compose pull && docker compose up -d
#
# About process names:
#   By default this compose bind-mounts the host /proc read-only into
#   /host/proc and sets HOST_PROC=/host/proc so GpuViewR can resolve GPU
#   process names without sharing the host PID namespace. If you prefer
#   the simpler `pid: host` mode, remove the /proc volume + HOST_PROC env
#   and add `pid: host` to the service.
# ===========================================

services:
  gpuviewr:
    image: ghcr.io/erreur32/gpuviewr:latest
    # Uncomment to build locally instead of pulling:
    # build: .
    container_name: gpuviewr
    restart: unless-stopped

    # Host port 7510 → container port 3015. Override via DASHBOARD_PORT in .env.
    ports:
      - "${DASHBOARD_PORT:-7510}:3015"

    environment:
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3015
      DASHBOARD_PORT: ${DASHBOARD_PORT:-7510}
      CONTAINER_NAME: gpuviewr
      HOST_IP: ${HOST_IP:-}
      TZ: ${TZ:-Europe/Paris}
      GPU_TICK_MS: ${GPU_TICK_MS:-1000}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      # PUBLIC_URL: https://gpu.example.com
      # Resolve GPU process names without sharing the host PID namespace.
      # Pair with the /proc:/host/proc:ro bind mount below.
      HOST_PROC: /host/proc
      # Real host hostname (the container's UTS namespace hides it).
      HOST_ETC: /host/etc
      # Optional explicit override — wins over the bind-mounts above:
      # HUB_HOSTNAME: my-server

    volumes:
      - ./data:/app/data
      # Read-only view of host /proc so we can resolve PID → process name
      # when nvidia-smi returns "[Not Found]" (multi-tenant / hardened setups).
      - /proc:/host/proc:ro
      # Static file from the host — kernel-independent way to recover
      # the real hostname from inside the container.
      - /etc/hostname:/host/etc/hostname:ro
      # Backward-compat with bigsk1/gpu-monitor users: these are read-only
      # references; new metrics go into ./data/gpuviewr.db. Optional.
      # - ./history:/app/legacy/history:ro
      # - ./logs:/app/legacy/logs:ro

    # Hardening: keep only the caps the entrypoint needs. The image's
    # docker-entrypoint.sh runs as root and uses `gosu` to drop privileges
    # to the unprivileged `node` user — that requires CHOWN + SETUID +
    # SETGID, plus DAC_OVERRIDE for the initial chown of /app/data when
    # the bind-mount is owned by another UID. Everything else is dropped.
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true

    # --- NVIDIA local passthrough (OPT-IN) -------------------------
    # Uncomment both blocks below if the NVIDIA Container Toolkit is
    # installed on this host and you want the hub to scrape its own
    # GPUs. Leave commented to keep the hub vendor-neutral (collector
    # logs a friendly "nvidia-smi not available" and exposes data
    # from remote agents only).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, utility]
    # runtime: nvidia

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3015/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
