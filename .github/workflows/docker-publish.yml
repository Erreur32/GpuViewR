name: Build & Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Dependabot PRs run with a restricted GITHUB_TOKEN that intermittently
    # fails actions/checkout on the matrix build (the agent cell of the same
    # run often succeeds while the hub cell fails to read the auth header).
    # The job pushes nothing on PRs anyway (see `push:` below), and CodeQL,
    # Snyk, SonarCloud and the standalone build job already validate the
    # dependency bump. Skipping here keeps the PR queue green.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      packages: write

    # Matrix builds the hub image and the agent image in parallel.
    # Both share the project root as build context (the agent
    # Dockerfile pulls in server/services/_*Parsers.ts from /server/
    # to keep parser logic single-sourced). Independent cache scopes
    # so a hub-only change doesn't invalidate the agent cache and
    # vice versa.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gpuviewr
            dockerfile: ./Dockerfile
            cache_scope: hub
          - image: gpuviewr-agent
            dockerfile: ./agent/Dockerfile
            cache_scope: agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Optional: log in to Docker Hub to avoid anonymous-pull rate limits on
      # buildx / QEMU base images. The step is best-effort: if you haven't set
      # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets, the workflow keeps going
      # and only pushes to GHCR.
      - name: Log in to Docker Hub (optional)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.package-version.outputs.version }},enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          platforms: linux/amd64,linux/arm64
